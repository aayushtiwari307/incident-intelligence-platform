# Single-origin topology for local verification. Use together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml --profile app up -d --build --wait
#
# Everything is reachable ONLY through the proxy at http://127.0.0.1:${EDGE_PORT:-8080}: the API and web containers no
# longer publish host ports. The browser uses same-origin REST and WebSocket URLs, so changing the public hostname does
# not require rebuilding the web image. Set PUBLIC_ORIGIN to the exact browser-visible origin (for example, an HTTPS
# trycloudflare URL) so API CSRF/CORS and WebSocket Origin checks remain strict rather than using a wildcard.
services:
  api:
    ports: !reset []
    environment:
      CORS_ORIGINS: "${PUBLIC_ORIGIN:-http://127.0.0.1:8080}"
      # Exactly one trusted reverse proxy (the edge service below) sits in front of the API.
      TRUST_PROXY_HOPS: "1"

  web:
    ports: !reset []
    build:
      args:
        # Empty base URL means same-origin /api and WebSocket requests; the browser-visible host can vary.
        NEXT_PUBLIC_API_URL: ""

  edge:
    profiles: ["app"]
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
