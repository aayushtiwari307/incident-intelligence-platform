# Single-origin topology for local verification. Use together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml --profile app up -d --build --wait
#
# Everything is reachable ONLY through the proxy at http://127.0.0.1:${EDGE_PORT:-8080}: the API and web containers no
# longer publish host ports. The browser talks to one origin, so the SameSite=Lax __Host- session cookie, CORS and the
# WebSocket Origin check all see the same origin. NEXT_PUBLIC_API_URL is baked into the web build, so building with this
# file produces a web image for THIS origin (rebuild without the file for the direct 3000/3001 topology).
services:
  api:
    ports: !reset []
    environment:
      CORS_ORIGINS: "http://127.0.0.1:${EDGE_PORT:-8080}"
      # Exactly one trusted reverse proxy (the edge service below) sits in front of the API.
      TRUST_PROXY_HOPS: "1"

  web:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://127.0.0.1:${EDGE_PORT:-8080}"

  edge:
    profiles: ["app"]
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
