services:
  - type: web
    name: incident-intelligence-free-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_ENABLED
        value: "true"
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_DAILY_REQUEST_LIMIT
        value: "20"
      - key: REALTIME_ENABLED
        value: "false"
      - key: REALTIME_DATABASE_URL
        sync: false
      # Next.js inlines this flag into the browser bundle during the Docker build.
      - key: NEXT_PUBLIC_REALTIME_ENABLED
        value: "false"
      - key: MIGRATE_ON_START
        value: check
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
